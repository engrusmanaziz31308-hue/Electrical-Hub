<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Electrical Hub — برقی حساب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --bg: #FFFFFF;
    --bg-alt: #F5F7FA;
    --surface: #FFFFFF;
    --surface-2: #EEF1F5;
    --line: #E1E6EC;
    --line-soft: #ECEFF3;
    --text: #172230;
    --text-muted: #57687A;
    --text-faint: #8A97A5;
    --amber: #9C6508;
    --amber-dim: #E9CB98;
    --green: #0E9A66;
    --red: #D64545;
    --blue: #1E6FBF;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-urdu: 'Noto Nastaliq Urdu', serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      linear-gradient(var(--bg) 0%, var(--bg) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='340' height='340' viewBox='0 0 340 340'><g fill='none' stroke='%231E6FBF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' opacity='0.055'><circle cx='58' cy='62' r='23'/><path d='M48 82 h20 M50 90 h16 M52 98 h12'/><path d='M46 60 q12 16 24 0 M58 39 v21'/><rect x='240' y='34' width='36' height='26' rx='4'/><path d='M250 60 v16 M266 60 v16 M235 46 h5 M281 46 h5'/><path d='M176 132 l-17 36 h15 l-19 38 l36-42 h-15 z'/><path d='M24 246 h16 l7 -11 l9 22 l9 -22 l9 22 l9 -22 l7 11 h16'/><circle cx='246' cy='250' r='4.5'/><circle cx='278' cy='223' r='4.5'/><circle cx='305' cy='262' r='4.5'/><path d='M246 250 h32 M250 246 l24 -19 M282 227 l19 31'/><rect x='128' y='258' width='30' height='42' rx='5'/><circle cx='138' cy='273' r='2.2'/><circle cx='150' cy='273' r='2.2'/><path d='M138 279 v10 M150 279 v10'/></g></svg>"),
      repeating-linear-gradient(0deg, rgba(30,111,191,0.028) 0px, rgba(30,111,191,0.028) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(30,111,191,0.028) 0px, rgba(30,111,191,0.028) 1px, transparent 1px, transparent 32px);
    background-repeat: no-repeat, repeat, repeat, repeat;
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
    line-height:1.5;
  }
  html[dir="rtl"] body{ font-family: var(--font-urdu); }
  html[dir="rtl"] .mono, html[dir="rtl"] input, html[dir="rtl"] select{ font-family: var(--font-mono); }

  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit;}

  ::selection{ background: var(--amber); color:#151515; }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-trace{
    height:2px; width:100%;
    background: linear-gradient(90deg, transparent, var(--amber) 20%, var(--amber) 80%, transparent);
    background-size: 200% 100%;
    animation: trace 5s linear infinite;
  }
  @keyframes trace{
    0%{ background-position: 200% 0; }
    100%{ background-position: -200% 0; }
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:8px;
    background: var(--surface-2);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color: var(--amber);
    font-family: var(--font-mono); font-weight:700; font-size:15px;
  }
  .brand-name{
    font-family: var(--font-display); font-weight:700; font-size:17px; letter-spacing:0.2px;
  }
  .brand-name small{
    display:block; font-family: var(--font-body); font-weight:500; font-size:11px; color:var(--text-muted); letter-spacing:0.4px; text-transform:uppercase;
  }

  .lang-toggle{
    display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;
    background: var(--surface);
  }
  .lang-toggle button{
    background:none; border:none; color:var(--text-muted);
    padding:7px 13px; font-size:13px; font-weight:600;
    font-family: var(--font-body);
  }
  .lang-toggle button.active{ background: var(--amber); color:#151515; }

  nav.mainnav{
    max-width:1180px; margin:0 auto;
    display:flex; gap:2px; padding:0 20px;
    overflow-x:auto;
    scrollbar-width: none;
  }
  nav.mainnav::-webkit-scrollbar{ display:none; }
  nav.mainnav button{
    background:none; border:none; color:var(--text-muted);
    padding:11px 14px; font-size:13.5px; font-weight:600;
    white-space:nowrap;
    border-bottom:2px solid transparent;
    font-family: var(--font-body);
  }
  html[dir="rtl"] nav.mainnav button{ font-family: var(--font-urdu); font-size:16px; padding-top:9px;}
  nav.mainnav button.active{ color: var(--amber); border-bottom-color: var(--amber); }
  nav.mainnav button:hover{ color: var(--text); }

  /* ---------- Layout ---------- */
  main{ max-width:1180px; margin:0 auto; padding:28px 20px 60px; }
  .page{ display:none; animation: fade .25s ease; }
  .page.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{
    font-family: var(--font-mono); font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--amber); margin-bottom:8px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:16px; height:1px; background:var(--amber); display:inline-block; }
  h1.page-title{
    font-family: var(--font-display); font-size: clamp(26px,4vw,36px); font-weight:700; margin-bottom:8px; letter-spacing:-0.3px;
  }
  html[dir="rtl"] h1.page-title{ font-family: var(--font-urdu); font-weight:600; }
  .page-desc{ color: var(--text-muted); font-size:14.5px; max-width:640px; margin-bottom:28px; }

  .grid{ display:grid; gap:16px; }
  .grid-2{ grid-template-columns: 1fr 1fr; }
  .grid-3{ grid-template-columns: repeat(3,1fr); }
  @media(max-width:760px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }

  .card{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding:20px;
    box-shadow: 0 1px 3px rgba(23,34,48,0.05), 0 1px 2px rgba(23,34,48,0.04);
  }
  .card h3{
    font-family: var(--font-display); font-size:15px; font-weight:700;
    margin-bottom:14px; display:flex; align-items:center; gap:8px;
    color: var(--text);
  }
  html[dir="rtl"] .card h3{ font-family: var(--font-urdu); font-size:18px; font-weight:600; }
  .card h3 .tag{
    font-family: var(--font-mono); font-size:10px; color:var(--amber);
    background: rgba(156,101,8,0.08); border:1px solid var(--amber-dim);
    padding:2px 6px; border-radius:4px;
  }

  label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:5px; font-weight:600; }
  html[dir="rtl"] label{ font-family: var(--font-urdu); font-size:15px; font-weight:500; }
  .field{ margin-bottom:14px; }
  input[type=number], input[type=text], select{
    width:100%; background: var(--bg-alt) !important; border:1px solid var(--line);
    color: var(--text) !important; padding:10px 12px; border-radius:7px; font-size:14px;
    font-family: var(--font-mono); color-scheme: light only;
  }
  input:focus, select:focus, button:focus-visible{
    outline:2px solid var(--amber); outline-offset:1px; border-color: var(--amber);
  }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }
  .unit-suffix{ position:relative; }
  .unit-suffix span{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); pointer-events:none;
  }
  html[dir="rtl"] .unit-suffix span{ right:auto; left:12px; }
  html[dir="rtl"] .unit-suffix input{ text-align:right; padding-left:44px; }

  .btn{
    background: var(--amber); color:#151515; border:none; font-weight:700;
    padding:11px 18px; border-radius:7px; font-size:13.5px;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn-ghost{
    background:none; border:1px solid var(--line); color:var(--text-muted); font-weight:600;
    padding:10px 16px; border-radius:7px; font-size:13px;
  }
  .btn-ghost:hover{ color:var(--text); border-color: var(--text-faint); }

  .result-box{
    background: var(--bg-alt); border:1px solid var(--line); border-radius:8px;
    padding:16px; margin-top:6px;
  }
  .result-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:9px 0; border-bottom:1px dashed var(--line-soft);
  }
  .result-row:last-child{ border-bottom:none; }
  .result-label{ font-size:13px; color:var(--text-muted); }
  .result-value{ font-family: var(--font-mono); font-size:15px; font-weight:700; color: var(--amber); }
  .result-value.big{ font-size:22px; }
  .result-value.green{ color: var(--green); }

  .note{
    font-size:12px; color:var(--text-faint); margin-top:10px; line-height:1.6;
    border-left:2px solid var(--line); padding-left:10px;
  }
  html[dir="rtl"] .note{ border-left:none; border-right:2px solid var(--line); padding-left:0; padding-right:10px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line-soft); }
  html[dir="rtl"] th, html[dir="rtl"] td{ text-align:right; font-size:15.5px; }
  th{ color:var(--text-muted); font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; font-family:var(--font-mono); font-weight:600; }
  html[dir="rtl"] th{ font-family: var(--font-urdu); font-size:13px; text-transform:none; letter-spacing:0; }
  td.mono, td input{ font-family: var(--font-mono); }
  tr:hover td{ background: rgba(30,111,191,0.035); }
  .qty-input{ width:68px; min-width:68px; padding:6px 8px; font-size:13.5px; text-align:center; }

  .home-hero{
    border:1px solid var(--line); border-radius:14px; padding:34px 28px;
    background: linear-gradient(135deg, var(--surface) 0%, var(--bg-alt) 100%);
    margin-bottom:24px; position:relative; overflow:hidden;
  }
  .home-hero::after{
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 85% 20%, rgba(156,101,8,0.10), transparent 45%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260'><g fill='none' stroke='%239C6508' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' opacity='0.10'><circle cx='170' cy='60' r='34'/><path d='M156 92 h28 M160 103 h20 M164 114 h12'/><path d='M150 60 q20 24 40 0 M170 26 v30'/><path d='M60 150 l-24 50 h20 l-26 52 l50-58 h-20 z'/><circle cx='60' cy='215' r='6'/><circle cx='105' cy='190' r='6'/><circle cx='140' cy='230' r='6'/><path d='M60 215 h45 M69 209 l31 -14 M111 194 l25 30'/></g></svg>");
    background-position: right top, right bottom;
    background-repeat: no-repeat, no-repeat;
    background-size: auto, 220px;
    pointer-events:none;
  }
  .home-hero h1{ font-family:var(--font-display); font-size:clamp(24px,4.2vw,34px); font-weight:700; max-width:560px; margin-bottom:10px;}
  html[dir="rtl"] .home-hero h1{ font-family:var(--font-urdu); font-weight:600; }
  .home-hero p{ color:var(--text-muted); max-width:520px; font-size:14.5px; }

  .tool-card{
    border:1px solid var(--line); border-radius:12px; padding:20px;
    background: var(--surface); display:flex; flex-direction:column; gap:10px;
    text-align:left; transition: border-color .15s, transform .15s, box-shadow .15s;
    box-shadow: 0 1px 3px rgba(23,34,48,0.05);
  }
  html[dir="rtl"] .tool-card{ text-align:right; }
  .tool-card:hover{ border-color: var(--amber-dim); transform:translateY(-2px); box-shadow: 0 6px 16px rgba(23,34,48,0.09); }
  .tool-icon{
    width:38px; height:38px; border-radius:8px; background:var(--bg-alt); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--amber); font-family:var(--font-mono); font-weight:700;
  }
  .tool-card h4{ font-family: var(--font-display); font-size:15.5px; font-weight:700; }
  html[dir="rtl"] .tool-card h4{ font-family: var(--font-urdu); font-size:18px; font-weight:600;}
  .tool-card p{ font-size:13px; color:var(--text-muted); line-height:1.55; flex:1; }
  .tool-card .go{ font-size:12px; color:var(--amber); font-weight:700; font-family:var(--font-mono); }

  .subtabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .subtabs button{
    background: var(--surface); border:1px solid var(--line); color:var(--text-muted);
    padding:8px 14px; border-radius:20px; font-size:12.5px; font-weight:600;
  }
  html[dir="rtl"] .subtabs button{ font-family: var(--font-urdu); font-size:14.5px; }
  .subtabs button.active{ background: var(--amber); color:#151515; border-color:var(--amber); }
  .subpage{ display:none; }
  .subpage.active{ display:block; }

  .search-box{ position:relative; margin-bottom:18px; }
  .search-box input{ padding-left:38px; }
  html[dir="rtl"] .search-box input{ padding-left:12px; padding-right:38px; }
  .search-box::before{
    content:'⌕'; position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); font-size:16px;
  }
  html[dir="rtl"] .search-box::before{ left:auto; right:13px; }

  .glossary-item{
    border:1px solid var(--line); border-radius:9px; padding:14px 16px; margin-bottom:10px;
    background: var(--surface);
  }
  .glossary-item .term{ font-family:var(--font-display); font-weight:700; font-size:14.5px; color:var(--text); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .glossary-item .term .ur{ font-family: var(--font-urdu); font-size:17px; color:var(--amber); font-weight:600; }
  .glossary-item .def{ font-size:13px; color:var(--text-muted); margin-top:6px; line-height:1.6; }
  html[dir="rtl"] .glossary-item .def{ font-family: var(--font-urdu); font-size:15px; }

  .chip{
    display:inline-block; font-family:var(--font-mono); font-size:10.5px;
    background:rgba(30,111,191,0.10); color:var(--blue); border:1px solid rgba(30,111,191,0.28);
    padding:2px 7px; border-radius:4px; margin-top:8px;
  }

  footer{
    border-top:1px solid var(--line); padding:22px 20px; text-align:center;
    color:var(--text-faint); font-size:12px;
  }

  @media(max-width:600px){
    .field-row{ flex-direction:column; gap:0; }
    .field-row > div{ width:100%; }
    .home-hero{ padding:24px 18px; }
    .topbar-inner{ padding:12px 14px; }
    nav.mainnav{ padding:0 14px; }
    main{ padding:20px 14px 50px; }
    h1.page-title{ font-size:23px; }
    .page-desc{ font-size:13.5px; margin-bottom:20px; }
    .card{ padding:16px; }
    .brand-name{ font-size:15px; }
    .brand-name small{ font-size:9px; }
    .brand-mark{ width:30px; height:30px; font-size:13px; }
    table{ font-size:12.5px; }
    th, td{ padding:8px 7px; }
    .home-hero h1{ font-size:22px; }
    .tool-card{ padding:16px; }
  }

  @media(max-width:420px){
    .lang-toggle button{ padding:6px 10px; font-size:12px; }
    .brand-name{ font-size:13.5px; }
    .btn, .btn-ghost{ padding:10px 14px; font-size:13px; }
  }

  /* ---------- Touch-friendly tap targets (mobile app) ---------- */
  input[type="text"], input[type="checkbox"], select, button{
    -webkit-tap-highlight-color: rgba(156,101,8,0.15);
  }
  input[type="checkbox"]{
    width:19px; height:19px; accent-color: var(--amber); cursor:pointer;
  }
  .btn, .btn-ghost, nav.mainnav button, .lang-toggle button, .subtabs button{
    min-height:40px; touch-action: manipulation;
  }
  input[type="text"], select{
    min-height:40px; touch-action: manipulation;
  }
  .qty-input{ min-height:36px; }

  /* ---------- PDF report (print) ---------- */
  #printArea{ display:none; }
  @media print{
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; padding:10px; color:#111; background:#fff; }
    #printArea.lang-ur{ font-family: var(--font-urdu); direction:rtl; }
    #printArea.lang-en{ font-family: var(--font-body); direction:ltr; }
    .rep-header{ margin-bottom:18px; border-bottom:2px solid #9C6508; padding-bottom:10px; }
    .rep-brand{ font-weight:700; font-size:14px; color:#9C6508; margin-bottom:6px; }
    .rep-header h1{ font-size:19px; margin-bottom:6px; font-weight:700; }
    .rep-meta{ font-size:11px; color:#555; }
    .rep-subhead{ margin-top:18px; margin-bottom:8px; font-size:14.5px; font-weight:700; }
    .rep-table, .rep-summary{ width:100%; border-collapse:collapse; margin-bottom:14px; font-size:12px; }
    .rep-table th, .rep-table td, .rep-summary td{ border:1px solid #ccc; padding:6px 8px; text-align:left; }
    #printArea.lang-ur .rep-table th, #printArea.lang-ur .rep-table td, #printArea.lang-ur .rep-summary td{ text-align:right; font-size:13.5px; }
    .rep-table th{ background:#f0f0f0; font-size:10.5px; text-transform:uppercase; }
    .rep-summary td:first-child{ font-weight:600; width:55%; }
    .rep-footer{ margin-top:18px; font-size:10.5px; color:#666; border-top:1px solid #ccc; padding-top:10px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-trace"></div>
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div class="brand-name" data-i18n="brandName">Electrical Hub<small data-i18n="brandTag">Design · Calculate · Learn</small></div>
    </div>
    <div class="lang-toggle">
      <button id="btnEn" class="active" onclick="setLang('en')">EN</button>
      <button id="btnUr" onclick="setLang('ur')">اردو</button>
    </div>
  </div>
  <nav class="mainnav" id="mainNav"></nav>
</div>

<main id="mainContent"></main>

<footer data-i18n="footerText">Reference values only — always confirm final electrical & solar design with a licensed electrician / installer.</footer>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
